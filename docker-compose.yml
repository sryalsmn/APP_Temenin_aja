version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: temenin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: temenin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: temenin_backend
    restart: always
    depends_on:
      - postgres
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/temenin?sslmode=disable
      JWT_SECRET: super-secret-temenin-jwt-key-change-in-prod
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.anthropic.com}
      AI_MODEL: ${AI_MODEL:-claude-3-5-haiku-20241022}
      ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"

volumes:
  pgdata:
